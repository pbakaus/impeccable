[package]
name = "impeccable-foundation"
version.workspace = true
edition = "2021"
# The helpers and plain-data types every rule check is written against.
license.workspace = true
publish.workspace = true

[features]
default = []
# Vector dispatcher for this crate's arms of the recorded JS call vectors.
# `impeccable-core`'s own `vectors` feature turns this on.
vectors = []
# The table-driven fake DOM for browser-rule tests.
fake-dom = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
regex = { workspace = true }
once_cell = { workspace = true }
selectors = "0.38"
cssparser = "0.37"
precomputed-hash = "0.1"
