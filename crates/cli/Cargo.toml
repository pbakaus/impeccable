[package]
name = "impeccable"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# See crates/account: lets a test or rehearsal build trust its own Pro release key.
test-release-keys = ["impeccable-account/test-release-keys"]

[dependencies]
impeccable-account = { workspace = true }
impeccable-common = { path = "../common" }
impeccable-context = { path = "../context" }
impeccable-browser = { path = "../browser" }
impeccable-detect = { path = "../detect" }
impeccable-html = { path = "../html" }
impeccable-hook = { path = "../hook" }
impeccable-live = { path = "../live" }
impeccable-skills = { path = "../skills" }
impeccable-core = { workspace = true }
impeccable-comp = { workspace = true }
impeccable-comp-verbs = { workspace = true }
impeccable-agents = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
semver = "1"
url = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"
toml_edit = "0.22"

[dev-dependencies]
impeccable-account = { workspace = true, features = ["test-release-keys"] }
ring = "0.17.14"
base64 = "0.22"
serde_json = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
url = "2"
