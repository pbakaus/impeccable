<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signup</title>
<script src="/js/analytics.js"></script>
<script>
  window.dataLayer = window.dataLayer || [];
</script>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/pricing">Pricing</a>
</nav>
<main id="main">
  <h1>Start your trial</h1>
  <img src="/logo.png" alt="Acme logo">
  <form action="/signup" method="post" data-testid="signup-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <select name="plan">
      <option>Free</option>
      <option>Team</option>
    </select>
    <input type="checkbox" name="terms" value="yes" required>
    <input type="hidden" name="csrf" value="abc">
    <textarea name="note" data-cy="note"></textarea>
    <button type="submit" onclick="track('signup')">Create account</button>
  </form>
  <h2>Questions?</h2>
  <a href="/" data-qa="footer-home">Back home</a>
</main>
</body>
</html>
