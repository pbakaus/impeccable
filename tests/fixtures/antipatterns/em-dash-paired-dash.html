<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Em dash overuse, the Chinese paired dash</title>
<!--
  Should pass. Chinese sets its dash (破折号) as two em dashes side by side,
  and each pair is one mark (taste call r14-t6): six pairs were twelve em
  dashes by the old count and are six marks, under the floor of eight.
-->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #ffffff; color: #111111; }
</style>
</head>
<body>
  <p>长白山——中国东北的最高峰，是一座休眠火山。</p>
  <p>天池——火山口积水而成的湖泊，位于山顶。</p>
  <p>雾凇——冬季常见的自然景观，沿江可见。</p>
  <p>查干湖——每年冬季举行冬捕节。</p>
  <p>伪满皇宫——位于长春市区，现为博物馆。</p>
  <p>净月潭——城市近郊的森林公园。</p>
</body>
</html>
