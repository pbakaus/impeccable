<!doctype html><meta charset="utf-8"><title>shadow-toggle</title>
<style>
body { font: 18px system-ui; margin: 40px; }
button { margin-bottom: 20px; }
#region { position: relative; width: 500px; height: 400px; }
#card { position: relative; width: 180px; height: 100px; padding: 20px; box-sizing: border-box; background: #eedcc5; view-transition-name: card; }
::view-transition-group(card) { animation-duration: 600ms; animation-timing-function: linear; }
#card { box-shadow: 0 12px 24px rgba(0,0,0,.4); }
</style>
<button id="go">Run motion</button><div id="region"><div id="card">Shadow should persist</div></div>
<script>
go.onclick = () => { card.style.boxShadow = 'none'; const transition = document.startViewTransition(() => { card.style.width = '280px'; }); transition.finished.then(() => { card.style.boxShadow = ''; }); };
</script>
