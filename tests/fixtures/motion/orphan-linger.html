<!doctype html><meta charset="utf-8"><title>orphan-linger</title>
<style>
body { font: 18px system-ui; margin: 40px; }
button { margin-bottom: 20px; }
#region { position: relative; width: 500px; height: 400px; }
#card { position: relative; width: 180px; height: 100px; padding: 20px; box-sizing: border-box; background: #eedcc5; view-transition-name: card; }
::view-transition-group(card) { animation-duration: 600ms; animation-timing-function: linear; }
#badge { position: absolute; left: 220px; top: 120px; width: 100px; height: 50px; background: #b4cbd5; view-transition-name: badge; } ::view-transition-old(badge) { animation: linger 1200ms linear both; } @keyframes linger { 0%, 90% { opacity: 1; } 100% { opacity: 0; } }
</style>
<button id="go">Run motion</button><div id="region"><div id="card">Surrounding motion</div><div id="badge">Removed</div></div>
<script>
go.onclick = () => document.startViewTransition(() => { badge.remove(); card.style.width = '280px'; });
</script>
