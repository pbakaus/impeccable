<!doctype html><meta charset="utf-8"><title>swap-while-growing</title>
<style>body{font:18px system-ui;margin:40px}button{margin-bottom:20px}#region{position:relative;width:500px;height:400px}#card{width:180px;height:100px;background:#eedcc5;padding:20px;box-sizing:border-box}</style>
<button id="go">Run motion</button><div id="region"><div id="card">Short summary</div></div>
<script>document.querySelector('#go').onclick=()=>{const c=document.querySelector('#card');c.textContent='Replacement content appears immediately';c.style.height='260px';c.animate([{height:'100px'},{height:'260px'}],{duration:600,fill:'both'});};</script>
