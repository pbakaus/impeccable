<!doctype html><meta charset="utf-8"><title>playback-rate</title>
<style>
body { font: 18px system-ui; margin: 40px; }
button { margin-bottom: 20px; }
#region { position: relative; width: 500px; height: 400px; }
#card { position: relative; width: 180px; height: 100px; padding: 20px; box-sizing: border-box; background: #eedcc5; view-transition-name: card; }
::view-transition-group(card) { animation-duration: 600ms; animation-timing-function: linear; }

</style>
<button id="go">Run motion</button><div id="region"><div id="card">Faster reduced motion</div></div>
<script>
go.onclick = () => { card.style.width = '280px'; const a = card.animate([{width:'180px'}, {width:'280px'}], {duration:600, fill:'both'}); a.updatePlaybackRate(matchMedia('(prefers-reduced-motion: reduce)').matches ? 5 : 1); };
</script>
