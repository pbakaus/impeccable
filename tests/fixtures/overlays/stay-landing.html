<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stays: a one-screen site on a fixed layer</title>
  <!-- The fixed layer is the whole site: it holds the h1 and the page has no text outside it.  -->
</head>
<body style="margin:0;background:#000">
<div class="stage" style="position:fixed;inset:0;background:#0d0d0d;color:#333;display:grid;place-items:center;font:20px sans-serif"><div style="text-align:center"><h1 id="own" style="color:#333;font-size:72px;margin:0">ORBITAL</h1><p style="color:#333">A listening room in Berlin</p><a href="/room" style="color:#333">Enter</a></div></div>
</body>
</html>
