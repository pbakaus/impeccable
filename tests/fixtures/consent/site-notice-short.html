<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consent hiding: a short page under its own cookie notice</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 40px; color: #111; background: #fff; }
    .faint { margin: 0 0 12px; font-size: 14px; line-height: 28px; color: #aaaaaa; }
    .body-copy { max-width: 640px; }
    /* The same notice over a page with under 200 characters of its own: a
       page that is little more than its notice is a consent wall, and the
       notice stays. Pinned by crates/browser/tests/consent_hiding.rs. */
    .cookie-banner { position: fixed; left: 0; right: 0; bottom: 0; height: 170px; padding: 24px 40px;
      background: #ffffff; border-top: 1px solid #d0d7de; z-index: 50; }
    .cookie-banner p { margin: 0 0 12px; max-width: 760px; font-size: 14px; color: #b0b0b0; }
  </style>
</head>
<body>
  <h1>A short page</h1>
  <p class="faint" id="covered-copy" style="position: absolute; top: 700px; left: 80px; width: 520px;">Faint copy the notice covers.</p>
  <a href="#" id="covered-cta" style="position: absolute; top: 740px; left: 80px; display: inline-block; padding: 8px 16px; border-radius: 6px; background: #ff7145; color: #ffffff; font-size: 15px; font-weight: 500; text-decoration: none;">Start free trial</a>
  <div class="cookie-banner" id="cookie-consent">
    <p id="notice-text">We use cookies to keep you signed in and to count visits.</p>
    <button type="button">Accept</button>
  </div>
</body>
</html>
