<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/kinpaku.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="ks-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="currentColor">
        <path d="M7 1 L18 1 L8 31 L7 31 Q1 31 1 25 L1 7 Q1 1 7 1 Z"/>
        <path d="M22 1 L25 1 Q31 1 31 7 L31 25 Q31 31 25 31 L12 31 Z"/>
      </svg>
    </span>
    <h1>Impeccable</h1>
  </header>

  <nav class="tabs" id="account-tabs" role="tablist" aria-label="Sections" hidden>
    <button class="tab" id="tab-scan" type="button" role="tab" aria-controls="panel-scan" aria-selected="true">Scan</button>
    <button class="tab" id="tab-personas" type="button" role="tab" aria-controls="panel-personas" aria-selected="false" tabindex="-1" hidden>Personas</button>
    <button class="tab tab-icon" id="tab-settings" type="button" role="tab" aria-controls="panel-settings" aria-selected="false" tabindex="-1" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </nav>

  <section id="panel-scan" role="tabpanel" aria-labelledby="tab-scan">
    <div class="count-display" id="count-display">
      <span class="count-number" id="count-number">0</span>
      <span class="count-label" id="count-label">anti-patterns</span>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-scan">Scan page</button>
      <button class="btn btn-secondary" id="btn-copy-all" disabled>Copy all findings</button>
      <button class="btn btn-secondary" id="btn-toggle">Hide overlays</button>
    </div>

    <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>

    <p class="scan-error" id="scan-error" hidden></p>
  </section>

  <section class="account-panel" id="panel-personas" role="tabpanel" aria-labelledby="tab-personas" hidden>
    <ul class="persona-list" id="persona-list"></ul>
    <p class="account-note" id="personas-note" hidden></p>
  </section>

  <section class="account-panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <p class="account-label" id="account-label"></p>
    <p class="account-email" id="account-email" hidden></p>
    <button class="btn btn-secondary" id="btn-sign-out" type="button" hidden>Sign out</button>
    <div class="helper-row" id="helper-row" hidden>
      <p class="account-label" id="helper-label"></p>
      <p class="helper-state" id="helper-state"></p>
      <button class="btn btn-secondary" id="btn-helper" type="button" hidden></button>
    </div>
    <label class="account-server" id="account-server-row" hidden>
      <span class="account-label">Server</span>
      <input id="account-server" type="url" spellcheck="false">
    </label>
  </section>

  <div class="sign-in" id="sign-in" hidden>
    <button class="btn btn-secondary" id="btn-sign-in" type="button"></button>
    <p class="account-note is-error" id="account-error" role="status" hidden></p>
  </div>

  <footer>
    <a href="https://impeccable.style" id="link-site">impeccable.style</a>
  </footer>

  <script src="../shared/findings-report.js"></script>
  <script src="popup.js"></script>
  <script src="words.js"></script>
  <script src="account.js"></script>
</body>
</html>
