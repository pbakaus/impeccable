<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impeccable</title>
  <link rel="stylesheet" href="../shared/kinpaku.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body data-step="does">
  <main class="card" aria-labelledby="title">
    <header class="top">
      <span class="ks-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="currentColor">
          <path d="M7 1 L18 1 L8 31 L7 31 Q1 31 1 25 L1 7 Q1 1 7 1 Z"/>
          <path d="M22 1 L25 1 Q31 1 31 7 L31 25 Q31 31 25 31 L12 31 Z"/>
        </svg>
      </span>
      <span class="ks-wordmark">Impeccable</span>
      <span class="kicker" id="kicker"></span>
    </header>

    <section class="screen" data-screen="does">
      <div class="tabstrip" aria-hidden="true">
        <span class="tab-own">your tab</span>
        <span class="tab-group"><span class="tab-group-label">Mira</span><span class="tab-walk">your site</span></span>
      </div>
      <h1 data-word="doesTitle"></h1>
      <p data-word="doesBody"></p>
      <ul class="points" data-list="doesPoints"></ul>
    </section>

    <section class="screen" data-screen="never" hidden>
      <h1 data-word="neverTitle"></h1>
      <ul class="points is-never" data-list="neverPoints"></ul>
    </section>

    <section class="screen" data-screen="ready" hidden>
      <h1 data-word="readyTitle"></h1>
      <p data-word="readyBody"></p>
    </section>

    <footer class="nav">
      <span class="dots" aria-hidden="true"><i></i><i></i></span>
      <button class="btn btn-secondary" id="btn-back" type="button" data-word="back"></button>
      <button class="btn btn-primary" id="btn-next" type="button" data-word="next"></button>
    </footer>
  </main>
  <script src="../popup/words.js"></script>
  <script type="module" src="onboarding.js"></script>
</body>
</html>
